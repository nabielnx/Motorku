name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sparepart_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use npm CLI with the current audit endpoint
        run: npm install --global npm@11.19.0 --no-audit
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Deployment health-check regression tests
        run: bash tests/shell/deploy-health-check-test.sh
      - name: Deployment cleanup regression tests
        run: bash tests/shell/deploy-cleanup-test.sh
      - name: Build frontend
        run: npm run build
      - name: PHP style and dependency checks
        run: |
          vendor/bin/pint --test app bootstrap/*.php config database routes scripts tests
          composer validate --strict
          composer audit
      - name: Audit production npm dependencies
        shell: bash
        run: |
          output_file=npm-audit.json

          for attempt in 1 2 3; do
            if npm audit --omit=dev --json --fetch-retries=0 --fetch-timeout=30000 >"$output_file" 2>&1; then
              node -e "const report=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log('Production dependency vulnerabilities:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))" "$output_file"
              exit 0
            else
              exit_code=$?
            fi

            cat "$output_file"

            if grep -Eqi '(^|[^0-9])(429|502|503|504)([^0-9]|$)|network timeout|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|UND_ERR_CONNECT_TIMEOUT|socket hang up' "$output_file" && [ "$attempt" -lt 3 ]; then
              echo "npm audit service/network error; retrying ($((attempt + 1))/3) after $((attempt * 10)) seconds."
              sleep $((attempt * 10))
              continue
            fi

            exit "$exit_code"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: production-dependency-advisories
          path: npm-audit.json
      - name: JavaScript regression tests
        run: node --test tests/js/*.test.js
      - name: Run tests
        run: composer test
