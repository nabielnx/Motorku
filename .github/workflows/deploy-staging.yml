name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
      APP_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          case "$DEPLOY_PATH" in /*) ;; *) exit 1 ;; esac
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
      - name: Check server is provisioned
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            test -f "$DEPLOY_PATH/.env"
            test -d "$DEPLOY_PATH/storage"
      - name: Package release
        run: |
          tar --exclude=bootstrap/cache --exclude=public/storage -czf release.tgz app bootstrap config database public resources routes artisan composer.json composer.lock vendor scripts
      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          source: release.tgz
          target: ${{ vars.STAGING_DEPLOY_PATH }}/.incoming-${{ github.event.workflow_run.head_sha }}
          overwrite: true
      - name: Activate release with backup
        id: activate
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_SHA
          script: |
            set -e
            incoming="$DEPLOY_PATH/.incoming-$RELEASE_SHA"
            tar -xzf "$incoming/release.tgz" -C "$incoming"
            bash "$incoming/scripts/deploy-release.sh" "$DEPLOY_PATH" "$incoming"
      - name: Health check
        run: curl --fail --location --retry 3 --retry-delay 5 "${APP_URL%/}/up"
      - name: Keep failed release in maintenance
        if: failure() && steps.activate.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan down
