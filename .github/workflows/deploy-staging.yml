name: Deploy staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
      APP_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          case "$DEPLOY_PATH" in /*) ;; *) exit 1 ;; esac
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
      - name: Check server is provisioned
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            test -f "$DEPLOY_PATH/.env"
            test -d "$DEPLOY_PATH/storage"
      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          source: app,bootstrap,config,database,public,resources,routes,artisan,composer.json,composer.lock,vendor
          target: ${{ vars.STAGING_DEPLOY_PATH }}
          overwrite: true
      - name: Finish deployment
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize
            php artisan queue:restart || true
      - name: Health check
        run: curl --fail --location --retry 3 --retry-delay 5 "$APP_URL"
