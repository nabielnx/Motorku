name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      first_install:
        description: First installation into a new empty database, without owner or demo data
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      APP_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&per_page=100" > ci-runs.json
          node scripts/check-ci-run.mjs ci-runs.json "$GITHUB_SHA" main
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          case "$DEPLOY_PATH" in /*) ;; *) exit 1 ;; esac
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --tags --quiet
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Release tag already exists: $RELEASE_VERSION"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
      - name: Build release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
      - name: Check server is provisioned
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          FIRST_INSTALL: ${{ inputs.first_install }}
          STAGING_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,FIRST_INSTALL,STAGING_PATH
          script: |
            set -e
            test -f "$DEPLOY_PATH/.env"
            test -d "$DEPLOY_PATH/storage"
            production=$(realpath -e "$DEPLOY_PATH")
            if [ -n "$STAGING_PATH" ]; then
              staging=$(realpath -m "$STAGING_PATH")
              case "$production/" in "$staging/"*) echo 'Production overlaps staging'; exit 1;; esac
              case "$staging/" in "$production/"*) echo 'Production overlaps staging'; exit 1;; esac
            fi
            if [ "$FIRST_INSTALL" = true ]; then
              test ! -e "$DEPLOY_PATH/artisan"
            else
              test -f "$DEPLOY_PATH/artisan"
            fi
      - name: Package release
        run: |
          tar --exclude=bootstrap/cache --exclude=public/storage -czf release.tgz app bootstrap config database public resources routes artisan composer.json composer.lock vendor scripts
      - name: Upload release
        id: upload
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          source: release.tgz
          target: ${{ vars.PRODUCTION_DEPLOY_PATH }}/.incoming-${{ github.sha }}
          overwrite: true
      - name: Activate release with backup
        id: activate
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
          FIRST_INSTALL: ${{ inputs.first_install }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_SHA,FIRST_INSTALL
          script: |
            set -e
            incoming="$DEPLOY_PATH/.incoming-$RELEASE_SHA"
            tar -xzf "$incoming/release.tgz" -C "$incoming"
            if [ "$FIRST_INSTALL" = true ]; then
              bash "$incoming/scripts/deploy-release.sh" "$DEPLOY_PATH" "$incoming" --first-install
            else
              bash "$incoming/scripts/deploy-release.sh" "$DEPLOY_PATH" "$incoming"
            fi
      - name: Health check
        run: bash scripts/check-deployment-health.sh "$APP_URL"
      - name: Keep failed release in maintenance
        if: failure() && steps.activate.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan down
      - name: Clean temporary release after deployment finishes
        if: always() && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_SHA
          script: |
            set -e
            cleanup="$DEPLOY_PATH/.incoming-$RELEASE_SHA/scripts/cleanup-incoming-release.sh"
            if [ -f "$cleanup" ]; then
              bash "$cleanup" "$DEPLOY_PATH" "$RELEASE_SHA" --apply
            else
              echo '::warning::Incomplete extraction; temporary release retained for review.'
            fi
      - name: Tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
