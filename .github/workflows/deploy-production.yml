name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      APP_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          case "$DEPLOY_PATH" in /*) ;; *) exit 1 ;; esac
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --tags --quiet
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Release tag already exists: $RELEASE_VERSION"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
      - name: Check server is provisioned
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            test -f "$DEPLOY_PATH/.env"
            test -d "$DEPLOY_PATH/storage"
      - name: Enable maintenance mode
        id: maintenance
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan down
      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          source: app,bootstrap,config,database,public,resources,routes,artisan,composer.json,composer.lock,vendor
          target: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          overwrite: true
      - name: Finish deployment
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize
            php artisan queue:restart || true
            php artisan up
      - name: Restore service if deployment fails
        if: failure() && steps.maintenance.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH" && php artisan up
      - name: Health check
        run: curl --fail --location --retry 3 --retry-delay 5 "$APP_URL"
      - name: Tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
